<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">pi-durabletask-mcp — 多模型分工，结论集中看。</title>
  <desc id="desc">Claude 或 Codex 向 Pi 提供任务分工，指挥者将代码审查、联网研究和测试脑暴交给不同 provider 的模型，再返回汇总与原始报告引用。</desc>
