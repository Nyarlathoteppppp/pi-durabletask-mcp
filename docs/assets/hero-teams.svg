    <text x="928" y="222" font-size="11" fill="#737367" letter-spacing="1">YOUR TASK PLAN</text>
    <rect x="785" y="132" width="250" height="66" rx="14" fill="#fffdf8" stroke="#d9d2c5"/>
    <circle cx="816" cy="165" r="12" fill="#e9e4d8"/>
    <path d="M812 165H820M816 161V169" stroke="#5d6056" stroke-width="1.6"/>
    <text x="841" y="171" font-size="19" font-weight="600" fill="#252724">Claude / Codex</text>
