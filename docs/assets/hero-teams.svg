      <text x="56" y="233">across models.</text>
      <text x="56" y="327">Bring findings</text>
      <text x="56" y="389" fill="#bd4c2b">together.</text>
    </g>
    <text x="58" y="445" font-size="19" fill="#5d6056">Multi-model agent teams, powered by Pi.</text>
    <text x="58" y="475" font-size="17" fill="#5d6056">Review code. Research sources. Explore ideas.</text>
    <rect x="58" y="507" width="259" height="32" rx="16" fill="#e9e4d8"/>
    <text x="187.5" y="528" text-anchor="middle" font-size="12" font-weight="650" letter-spacing="1" fill="#50564b">FOR CLAUDE CODE &amp; CODEX</text>

    <g stroke="#a69d8c" stroke-width="1.6" fill="none">
      <path d="M910 198V235" marker-end="url(#arrow)"/>
