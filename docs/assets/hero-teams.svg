      <text x="452" y="618"><tspan fill="#bd4c2b">02</tspan><tspan dx="13">Fork Shared Context</tspan></text>
      <text x="847" y="618"><tspan fill="#bd4c2b">03</tspan><tspan dx="13">Question Then Synthesize</tspan></text>
