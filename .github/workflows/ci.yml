name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        # Cover legacy SDKs as well as the current release; the bridge links this global install.
        pi: ["1.0.0", "1.0.4", "1.1.0", "1.3.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install shared Pi SDK
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          npm install -g @earendil-works/pi-coding-agent@"$PI_VERSION"
          sdk_dir="$(npm root -g)/@earendil-works/pi-coding-agent"
          if [[ "$PI_VERSION" == 1.0.* || "$PI_VERSION" == 1.1.* ]]; then
            # These releases used ^ ranges and now pull incompatible newer Pi packages.
            # Reconstruct their matching internal release set, only in the CI installation.
            (
              cd "$sdk_dir"
              node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const name of Object.keys(manifest.dependencies)) {
            if (name.startsWith('@earendil-works/')) manifest.dependencies[name] = process.env.PI_VERSION;
          }
          // --omit=dev still resolves dev peers; npm 10 crashes on the SDK's dev graph.
          // This CI copy only runs the SDK, so do not resolve its development dependencies.
          delete manifest.devDependencies;
          writeFileSync('package.json', JSON.stringify(manifest, null, 2));
          JS
              npm install --omit=dev --ignore-scripts --no-audit --no-fund
            )
          fi
          # Fail at setup, rather than reporting a test failure for a broken SDK import.
          node --input-type=module -e 'await import(process.argv[1])' "$sdk_dir/dist/index.js"
      - run: npm ci
      - run: npm run test:ci
